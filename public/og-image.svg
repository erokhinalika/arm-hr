<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311084" />
    </linearGradient>

    <!-- Logo Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Icon Elements Gradient (Pure White to soft lavender/blue) -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Background Decorative Glowing Circles -->
  <circle cx="1000" cy="100" r="300" fill="#7c3aed" opacity="0.15" filter="blur(80px)" />
  <circle cx="200" cy="550" r="250" fill="#06b6d4" opacity="0.1" filter="blur(60px)" />

  <!-- Logo and Left Section (Unified Card) -->
  <g transform="translate(100, 115)" filter="url(#logo-shadow)">
    <!-- Large Logo Squircle Container -->
    <rect width="400" height="400" rx="110" fill="url(#logo-bg)" />
    
    <!-- Inner SVG Icon details (Scaled from 512x512 down to size with proper centering) -->
    <g transform="translate(20, 20) scale(0.703)">
      <!-- Subtly Glowing Background Accent Circle -->
      <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />

      <!-- Monogram Logo "HR" -->
      <g>
        <!-- --- LETTER H --- -->
        <!-- Left Stem -->
        <rect x="110" y="140" width="48" height="232" rx="24" fill="url(#icon-grad)" />
        
        <!-- Right Stem -->
        <rect x="214" y="140" width="48" height="232" rx="24" fill="url(#icon-grad)" />
        
        <!-- Crossbar -->
        <rect x="146" y="232" width="80" height="48" rx="8" fill="url(#icon-grad)" />

        <!-- --- LETTER R --- -->
        <!-- Vertical Stem -->
        <rect x="302" y="140" width="48" height="232" rx="24" fill="url(#icon-grad)" />
        
        <!-- Loop and Leg -->
        <path d="M 326,164 H 360 A 46,46 0 0,1 360,256 H 326 M 346,250 L 390,352" 
              fill="none" 
              stroke="url(#icon-grad)" 
              stroke-width="48" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
      </g>

      <!-- Glowing Tech / Spark Accent in Top-Right -->
      <g transform="translate(395, 125)">
        <!-- Soft Background Glow -->
        <circle cx="0" cy="0" r="20" fill="#2dd4bf" opacity="0.4" filter="blur(6px)" />
        <!-- Core Spark Geometry -->
        <path d="M 0,-14 Q 0,0 -14,0 Q 0,0 0,14 Q 0,0 14,0 Q 0,0 0,-14 Z" fill="#2dd4bf" />
      </g>
    </g>
  </g>

  <!-- Right Section: Typography and Info -->
  <g transform="translate(560, 120)">
    <!-- Main Title -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
      HR ARM Modern
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#a78bfa" letter-spacing="0.5">
      Автоматизированное рабочее место
    </text>
    
    <!-- Divider -->
    <line x1="0" y1="165" x2="480" y2="165" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

    <!-- Feature Items -->
    <!-- Feature 1 -->
    <g transform="translate(0, 210)">
      <!-- Checkmark badge background -->
      <circle cx="20" cy="10" r="14" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5" />
      <!-- Small check icon -->
      <path d="M15 10 L18 13 L25 7" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#f1f5f9">
        Управление вакансиями и кандидатами
      </text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 270)">
      <circle cx="20" cy="10" r="14" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5" />
      <path d="M15 10 L18 13 L25 7" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#f1f5f9">
        Умный подбор и воронка найма
      </text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 330)">
      <circle cx="20" cy="10" r="14" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5" />
      <path d="M15 10 L18 13 L25 7" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#f1f5f9">
        Удобная аналитика и база резюме
      </text>
    </g>

    <!-- Footer Badge / Domain -->
    <g transform="translate(0, 395)">
      <rect width="170" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#a78bfa" letter-spacing="1">
        HR WORKSPACE
      </text>
    </g>
  </g>
</svg>
